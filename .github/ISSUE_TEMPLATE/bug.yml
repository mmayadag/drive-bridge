name: Bug
description: Something in Drive Bridge does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: '1. '
  - type: input
    id: plugin
    attributes:
      label: Drive Bridge version
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS, Windows, Linux, iOS or Android
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In Drive Bridge settings, the clipboard icon in the Help and support row (or the command *Copy a problem report*) copies versions, settings without secrets and the recent log. Paste it here and remove anything private, such as note names.
      render: text
