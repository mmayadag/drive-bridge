name: Release Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

# One release job per tag: two runs for the same tag would race to create it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-plugin:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check the tag matches the manifest version
        run: |
          manifest=$(jq -r .version manifest.json)
          tag="${{ github.ref_name }}"
          if [ "$manifest" != "${tag%%-*}" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Extract release notes
        run: bun scripts/release-notes.ts "${{ github.ref_name }}"

      - name: Install dependencies
        run: bun install

      - name: Detect release mode
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Run checks
        run: bun check

      - name: Build plugin
        run: bun run build

      - name: Run tests
        run: bun tests

      - name: Attest plugin artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prerelease_flag=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          assets="dist/main.js dist/manifest.json dist/styles.css"

          # A release for this tag can already exist (a re-run, or a release cut
          # by hand). Fill it in rather than failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title="$tag" \
              --notes-file=release-notes.md \
              --prerelease="$IS_PRERELEASE"
            # shellcheck disable=SC2086
            gh release upload "$tag" $assets --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$tag" \
              --title="$tag" \
              --notes-file=release-notes.md \
              $prerelease_flag \
              $assets
          fi
